AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Ephemeral Rocket.Chat event - NAT stack (disposable).
  Creates a NAT Gateway + EIP and adds a 0.0.0.0/0 route into the private
  route table exported by the network stack. Delete this stack to stop NAT
  charges once Docker images are pulled; the EC2 and CloudFront keep running,
  only outbound internet from the private subnet goes away.

Parameters:
  ProjectName:
    Type: String
    Default: ephemeral-rocketchat
    Description: Must match the ProjectName used in the network stack.

Resources:
  NatEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-nat-eip"

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId:
        Fn::ImportValue: !Sub "${ProjectName}-PublicSubnet1Id"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-nat"

  # Adds the default route into the network stack's private route table.
  # Deleting this stack removes this route, cutting outbound internet access.
  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub "${ProjectName}-PrivateRouteTableId"
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

Outputs:
  NatGatewayId:
    Value: !Ref NatGateway
  NatEipAddress:
    Value: !Ref NatEip
