<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Rocket.Chat 準備中...</title>
  <style>
    :root {
      --bg: #0d1b2a;
      --card: #16263b;
      --accent: #ff9900;
      --text: #e8eef5;
      --muted: #9fb3c8;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
                   "Hiragino Sans", Meiryo, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1b3a5c 0%, var(--bg) 60%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.7;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid rgba(255, 153, 0, 0.25);
      border-radius: 16px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    .badge {
      display: inline-block;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--accent);
      border: 1px solid rgba(255, 153, 0, 0.5);
      border-radius: 999px;
      padding: 6px 14px;
      margin-bottom: 28px;
    }
    .icon {
      font-size: 56px;
      margin-bottom: 16px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    h1 {
      font-size: 26px;
      margin: 0 0 12px;
      font-weight: 700;
    }
    p {
      color: var(--muted);
      margin: 0 0 10px;
      font-size: 15px;
    }
    .event {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 14px;
      color: var(--muted);
    }
    .event strong { color: var(--text); }
    a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.2s ease;
    }
    a:hover,
    a:focus { color: #ffc166; }
    .dots span {
      display: inline-block;
      animation: blink 1.4s infinite both;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; }
      40% { opacity: 1; }
    }
    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: rgba(159, 179, 200, 0.6);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">JAWS-UG XXXX</div>
    <div class="icon" aria-hidden="true">🚀</div>
    <h1>ただいま準備中です<span class="dots"><span>.</span><span>.</span><span>.</span></span></h1>
    <p>このチャットサーバーはイベント当日に公開されます。</p>
    <p>イベント詳細は、<a href="https://">こちら</a>。</p>

    <div class="event">
      <p><strong>JAWS-UG XX支部</strong></p>
      <p>開催日: <strong>202X年XX月XX日</strong></p>
    </div>

    <div class="footer">Powered by Rocket.Chat on Amazon EC2</div>
  </main>
</body>
</html>
